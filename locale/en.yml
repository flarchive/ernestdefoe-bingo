      awards:
        name: Awards Show Bingo
        squares: |
          Speech gets played off
          A winner forgets to thank someone
          "I didn't prepare anything"
          A political joke
          Someone trips on the stairs
          A surprise performance
          Host does a costume change
          Two presenters' joke falls flat
          A standing ovation
          Camera finds a celebrity couple
          Someone thanks their mom
          A winner cries
          A tie
          The envelope gets mixed up
          In Memoriam segment
          A winner reads from their phone
          Bleeped word
          Someone brings their kid
          A pizza or food delivery bit
          A musical number about the nominees
          The show runs long
          An award for a sequel
          A winner is not there
          Someone says "this is for everyone at home"
          A dramatic dress or suit
          Audience member asleep on camera
          Host roasts a famous guest
          Teleprompter mistake
          A selfie on stage
          Long walk to the stage
      stream:
        name: Livestream Bingo
        squares: |
          "Can you hear me?"
          Stream starts late
          A pet appears
          Chat spams the same emote
          Someone gets a big donation
          "Like and subscribe"
          Mic is muted
          Internet drops
          Game crashes
          Streamer rages
          A clutch play
          Backseat gaming in chat
          A raid
          Streamer forgets to switch scenes
          Sponsor read
          A doorbell rings
          Snack break
          "Chat, is this real?"
          Someone asks "what's your setup?"
          A new follower goal is hit
          Accidental tab reveal
          A poll in chat
          "One more game"
          Streamer sings
          Dramatic music sting
          Typo in a stream title
          A guest joins
          "I'll be right back"
          Lag spike
          Mods time someone out

    post:
      called: "{username} called Bingo on {line} in {game}!"
      results: "{game} is over."
      no_winner: Nobody got Bingo this time.
      reopened: "{game} is back on: a place opened up after a ruling."
      pending: "{count, plural, one {One call is still being checked, so this may change.} other {# calls are still being checked, so this may change.}}"
      started: "{username} started a Bingo game: {game}."
      play: Play

    strip:
      card: My card
      results: Results

    controls:
      start: Start a Bingo game

    notification:
      call: "{username} called Bingo in {title}"
      dispute: "{username} disputed a Bingo call in {title}"
      accepted: "Your Bingo in {title} counts!"
      won: "Your Bingo in {title} won {place}!"
      rejected: "Your Bingo call in {title} was not accepted"
      review_preference: Someone calls or disputes a Bingo in a game I host
      result_preference: My Bingo call is accepted or rejected

    errors:
      bingo_not_found: That Bingo game doesn't exist, or you can't see it.
      bingo_over: This game is over.
      bingo_not_started: This game hasn't started yet.
      bingo_too_soon: The game just started. Nothing can have happened yet!
      bingo_not_player: Get your card first.
      bingo_host_cannot_play: You're hosting this game, so you referee instead of playing.
      bingo_bad_cell: That isn't a square on your card.
      bingo_slow_down: You're going a bit fast. Try again in a minute.
      bingo_already_won: You already have a Bingo in this game.
      bingo_call_waiting: Your last call is still waiting for the host.
      bingo_too_many_calls: You've called Bingo too many times in this game.
      bingo_line_refused: A call on that line was already turned down.
      bingo_no_line: Your card doesn't have a full line yet.
      bingo_not_host: Only the host or a moderator can do that.
      bingo_player_cannot_referee: You have a card in this game, so you can't confirm squares or rule on calls.
      bingo_bad_ruling: That isn't something the host can do with a call.
      bingo_cannot_dispute: You can't dispute this call.
      bingo_disputed_already: You already disputed this call.
      bingo_cannot_attach: You can't start a game in that discussion.
      bingo_no_title: Give the game a name.
      bingo_too_few_squares: Add at least 24 different squares.
      bingo_too_few_squares_no_free: Without a free center, add at least 25 different squares.
      bingo_too_many_squares: That's too many squares. 150 is the most a game can have.
      bingo_square_too_long: Keep each square to 80 characters.
      bingo_bad_times: Check the start and end times.
      bingo_ends_before_start: The game has to end after it starts.
      bingo_too_long: A game can last at most 14 days.
      bingo_bad_action: That isn't something you can do with a game.
      bingo_bad_squares: The squares could not be read.
