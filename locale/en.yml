ernestdefoe-bingo:
  admin:
    settings:
      nav: Show "Bingo" in the forum's sidebar
      allow_indexing: Let search engines index the Bingo pages
      allow_indexing_help: Off by default. Games and their cards need JavaScript, so there is little for a search engine to read.
    permissions:
      view: View Bingo games
      play: Play Bingo
      create: Host Bingo games
      moderate: Referee every Bingo game (confirm squares, rule on calls, edit and delete games)

  lib:
    gdpr:
      export: Bingo games you host, your cards and marks, your calls and disputes.
      delete: Your Bingo cards, calls and disputes are deleted. Games you host stay, without a host.

  forum:
    nav: Bingo

    hub:
      title: Bingo
      lead: Play along with the big game, the ads, the keynote or the stream. Everyone gets their own card.
      create: New game
      load_error: Bingo could not be loaded. Please try again.
      empty: No games yet. Start one for the next big event!
      live: Live now
      upcoming: Coming up
      past: Finished
      more: Show more
      board: Winners
      board_medal: "{place} ×{count}"
      mine: "{count, plural, one {You're one away!} other {You're # away}}"
      mine_bingo: You have Bingo!

    status:
      upcoming: Coming up
      live: Live
      finished: Finished

    clock:
      starts_in: Starts in {time}
      ends_in: Ends in {time}
      ended: Ended {time}

    game:
      hosted_by: Hosted by {host}
      players: "{count, plural, one {# player} other {# players}}"
      winners: Winners

    rules:
      confirmed: A Bingo counts as soon as the host has confirmed every square on the line.
      host: The host or a moderator checks each Bingo.
      trust: "Honor system: a Bingo counts right away, and other players can dispute it."
      places: "{count, plural, one {The first Bingo wins.} other {Prizes for the first # places.}}"

    manage:
      edit: Edit
      start: Start now
      end: End now
      end_confirm: End this game now? Players can't mark or call anymore.
      delete: Delete
      delete_confirm: Delete this game, every card and every call? This can't be undone.

    join:
      title: Get your card
      help: "Your card is dealt from {count} squares at random, so nobody else has the same one. Mark squares as they happen, and call Bingo when you complete a row, a column or a diagonal."
      button: Get my card
      log_in: Log in to play
      watch_only: You can watch this game, but you can't play.
      over: This game is over.
      hosting_title: You're the host
      hosting: "You confirm squares as they happen and rule on Bingo calls, so you don't get a card in your own game."

    card:
      label: Your Bingo card
      free: Free
      bingo: Bingo!
      call_it: "You have Bingo on {line}! Call it!"
      refused: Your call on that line was not accepted. Keep going!
      one_away: One away!
      away: "{count} to go for Bingo"
      waiting: Your Bingo is waiting for the host.
      won: "You won {place}! 🎉"
      won_unplaced: Your Bingo counts! The prizes were already taken.
      not_started: The game hasn't started yet. You can look at your card.
      over: This game is over.
      open_page: Open the game page

    place:
      1: 1st place
      2: 2nd place
      3: 3rd place

    line:
      row: row {n}
      column: the {letter} column
      diagonal: a diagonal

    calls:
      title: Bingo calls
      none: No calls yet.
      called: called Bingo on {line}
      show_line: See the squares
      pending: Waiting for the host
      accepted: Counts
      rejected: Not accepted
      disputed: "{count, plural, one {Disputed} other {Disputed ×#}}"
      accept: Accept
      reject: Reject
      reject_title: Reject this Bingo
      reject_help: Tell the player why, if you like. They'll be notified.
      uphold: Keep it
      dispute: Dispute
      dispute_title: Dispute this Bingo
      dispute_help: What didn't happen? The host will take a look.

    reason:
      send: Send

    leaders:
      title: Closest to Bingo
      one_away: "{count} players are one away!"
      away_one: One away
      away: "{count} to go"

    squares:
      title: Squares
      confirmed_count: "{count} of {total} happened"
      help_confirmed: Tap "It happened" as things happen. A Bingo counts as soon as all its squares are confirmed.
      help_host: Confirming squares helps you check calls. You accept or reject each Bingo yourself.
      help_trust: Confirming squares is optional here, but it helps players settle disputes.
      filter: Find a square
      crowd: "{count, plural, one {Marked by # player} other {Marked by # players}}"
      happened: It happened
      undo: Undo

    form:
      title: New Bingo game
      edit_title: Edit game
      in_discussion: "Plays along in \"{title}\": calls and results are posted there."
      name: Name
      name_placeholder: Super Bowl Ad Bingo
      description: Description (optional)
      squares: Squares, one per line
      squares_help: "At least {count}. Things that might happen: \"Puppy in an ad\", \"Fumble\", \"One more thing\". Each card gets a random 24 of them."
      squares_locked: Players already have their cards, so squares can't be added, removed or moved. You can still fix the wording.
      locked_count: "Keep exactly {count} squares: players already have their cards."
      template: Add ideas from a ready-made pack…
      count: "{count} squares (at least {need})"
      free_center: Free center square
      free_label: Free square text
      starts: Starts
      ends: Ends
      places: Winners
      places_1: First Bingo only
      places_2: 1st and 2nd
      places_3: 1st, 2nd and 3rd
      verify: How calls are checked
      verify_confirmed: Against squares the host confirms
      verify_host: The host checks each call
      verify_trust: Honor system
      create: Start the game
      save: Save
      created: Your game is up! Look for it under the title.

    templates:
      super_bowl:
        name: Super Bowl Ad Bingo
