          A dog steals the show
          A celebrity plays themselves
          A sequel to an old ad
          Talking animal
          A baby or toddler
          Someone cries
          An ad for a movie trailer
          Robots or AI
          A Clydesdale
          A car does something impossible
          Nostalgic 80s or 90s song
          A cameo by a retired athlete
          Two celebrities together
          The ad is a mystery until the end
          QR code on screen
          Beer ad
          Chips or snack ad
          Ad makes you say "huh?"
          A cowboy
          An ad that's all one shot
          Somebody falls down
          A flash mob or dance
          Space or aliens
          Grandparents being cool
          A fake-out ending
          The word "game day"
          A musician performs in the ad
          An ad for an app you've never heard of
          Someone breaks the fourth wall
          A ridiculous slow-motion moment
